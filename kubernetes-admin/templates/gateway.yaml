# Original example: https://cloud.google.com/kubernetes-engine/docs/how-to/deploying-gateways#redirect_http_traffic_from_an_infrastructure_namespace

apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra-config
  labels:
    httpAllowed: "true"
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: external-http
  namespace: gateway-infra
  annotations:
    {{- if .Values.gateway.certMap }}
    {{- if eq .Values.provider "gcp" }}
    networking.gke.io/certmap: {{ .Values.gateway.certMap }}
    {{- end }}
    {{- end }}
spec:
  {{- if eq .Values.provider "gcp" }}
  gatewayClassName: gke-l7-global-external-managed
  {{- else }}
  gatewayClassName: cilium  
  {{- end }}
  {{- if .Values.gateway.namedAddress }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.namedAddress }}
  {{- end }}
  infrastructure:
    annotations:
      {{- if .Values.gateway.tlsTerminate }}
      {{- if eq .Values.provider "upcloud" }}
      service.beta.kubernetes.io/upcloud-load-balancer-config: |
        {
          "frontends": [
            {
              "name": "port-80",
              "mode": "http",
              "port": 80
            },
            {
              "name": "port-443",
              "mode": "tcp",
              "port": 443
            }
          ]
        }
      {{- end }}
      {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              httpAllowed: "true"
    {{- if .Values.gateway.tlsTerminate }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- if not .Values.gateway.certMap }}
      tls:
        mode: Terminate
        certificateRefs: []
      {{- end }}
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
    {{- end }}
---
{{- if eq .Values.provider "gcp" }}
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: external-http
  namespace: gateway-infra
spec:
  default:
    sslPolicy: {{ .Values.gateway.sslPolicy }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: external-http
---
{{- end }}
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: redirect
  namespace: gateway-infra-config
spec:
  parentRefs:
    - namespace: gateway-infra
      name: external-http
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
