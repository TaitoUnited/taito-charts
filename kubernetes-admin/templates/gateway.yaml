# Original example: https://cloud.google.com/kubernetes-engine/docs/how-to/deploying-gateways#redirect_http_traffic_from_an_infrastructure_namespace

apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-infra-config
  labels:
    httpAllowed: "true"
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: external-http
  namespace: gateway-infra
  annotations:
    {{- if .Values.provider }}
    {{- if eq .Values.provider "gcp" }}
    networking.gke.io/certmap: {{ .Values.gateway.certMap }}
    {{- end }}
    {{- end }}
spec:
  {{- if .Values.provider }}
  {{- if eq .Values.provider "gcp" }}
  gatewayClassName: gke-l7-global-external-managed
  {{- end }}
  {{- end }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.namedAddress }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              httpAllowed: "true"
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
---
{{- if .Values.provider }}
{{- if eq .Values.provider "gcp" }}
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: external-http
  namespace: gateway-infra
spec:
  default:
    sslPolicy: {{ .Values.gateway.sslPolicy }}
    securityPolicy: {{ .Values.gateway.securityPolicy }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: external-http
---
{{- end }}
{{- end }}
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: redirect
  namespace: gateway-infra-config
spec:
  parentRefs:
    - namespace: gateway-infra
      name: external-http
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
